<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Admin Security Dashboard</title>
  <style>
    body { font-family: Arial; background: #f6f8fa; margin: 20px; }
    h2 { color: #1d3557; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { padding: 12px; border: 1px solid #ccc; text-align: left; }
    th { background-color: #457b9d; color: white; }
    .stat-box { display:flex; gap:20px; margin-bottom:20px; }
    .box { background:#1d3557; color:white; padding:20px; border-radius:5px; flex:1; text-align:center; }
  </style>
</head>
<body>
<h2>Admin Security Dashboard</h2>

<div class="stat-box">
  <div class="box">
    <h3 th:text="${failedLogins.size()}"></h3>
    <p>Failed Logins</p>
  </div>
  <div class="box">
    <h3 th:text="${successfulLogins.size()}"></h3>
    <p>Successful Logins</p>
  </div>
  <div class="box">
    <h3 th:text="${totalLogs}"></h3>
    <p>Total Log Entries</p>
  </div>
</div>

<h3>Recent Activity</h3>
<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Action</th>
    <th>Details</th>
    <th>Timestamp</th>

  </tr>
  </thead>
  <tbody>
  <tr th:each="log : ${recentLogs}">
    <td th:text="${log.id}"></td>
    <td th:text="${log.action}"></td>
    <td th:text="${log.details}"></td>
    <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>

  </tr>
  </tbody>
</table>
</body>
</html>
