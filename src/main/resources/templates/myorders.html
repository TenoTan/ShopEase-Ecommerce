<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ShopEase</title>
    <link rel="stylesheet" th:href="@{/css/myorders.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>My Orders</h1>
        <a href="/postlogin.html" class="btn-back">← Back to Home</a>
    </div>

    <div id="orders-container"></div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading your orders...</p>
    </div>

    <div id="empty-orders" class="empty-orders" style="display: none;">
        <div class="empty-icon">📦</div>
        <h2>No orders yet</h2>
        <p>Start shopping to see your orders here</p>
        <a href="/postlogin.html" class="btn-shop">Start Shopping</a>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        fetchOrders();
    });

    function fetchOrders() {
        const loading = document.getElementById('loading');
        const emptyOrders = document.getElementById('empty-orders');
        const container = document.getElementById('orders-container');

        fetch('/api/customer/orders')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch orders');
                }
                return response.json();
            })
            .then(orders => {
                console.log('Orders received:', orders);
                loading.style.display = 'none';

                if (orders.length === 0) {
                    emptyOrders.style.display = 'block';
                    return;
                }

                orders.forEach(order => {
                    const orderCard = createOrderCard(order);
                    container.appendChild(orderCard);
                });
            })
            .catch(error => {
                console.error('Error fetching orders:', error);
                loading.style.display = 'none';
                container.innerHTML = `
                    <div class="error-message">
                        <h2>Error loading orders</h2>
                        <p>Please try again later</p>
                    </div>
                `;
            });
    }

    function createOrderCard(order) {
        const card = document.createElement('div');
        card.className = 'order-card';

        const statusClass = getStatusClass(order.status || 'Pending');

        card.innerHTML = `
            <div class="order-header">
                <div>
                    <div class="order-id">Order #${order.id}</div>
                    <div class="order-date">${formatDate(order.orderDate)}</div>
                </div>
                <div class="order-status ${statusClass}">${order.status || 'Pending'}</div>
            </div>

            <div class="order-items">
                ${order.items && order.items.length > 0 ? order.items.map(item => `
                    <div class="order-item">
                        <div class="item-image">
                            ${item.imageUrl ?
            `<img src="${item.imageUrl}" alt="${item.productName || 'Product'}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                 <div class="item-image-placeholder" style="display:none;">📦</div>`
            :
            `<div class="item-image-placeholder">📦</div>`
        }
                        </div>
                        <div class="item-details">
                            <div class="item-name">${item.productName || 'Product'}</div>
                            <div class="item-quantity">Quantity: ${item.quantity}</div>
                        </div>
                        <div class="item-price">₹${item.totalPrice ? item.totalPrice.toFixed(2) : '0.00'}</div>
                    </div>
                `).join('') : '<p>No items</p>'}
            </div>

            <div class="order-summary">
                <div class="summary-row">
                    <span>Total Amount:</span>
                    <span class="total-amount">₹${order.amount ? order.amount.toFixed(2) : '0.00'}</span>
                </div>
                <div class="payment-info">
                    💳 ${order.payment ? order.payment.paymentMethod : 'N/A'}
                </div>
            </div>
        `;

        return card;
    }

    function formatDate(dateString) {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function getStatusClass(status) {
        const statusMap = {
            'Pending': 'status-pending',
            'Confirmed': 'status-confirmed',
            'Shipped': 'status-shipped',
            'Delivered': 'status-delivered',
            'Cancelled': 'status-cancelled'
        };
        return statusMap[status] || 'status-pending';
    }
</script>
</body>
</html>
