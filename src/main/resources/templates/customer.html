<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Signup/Login</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/customerlogin.css}">
    <style>
        .password-strength {
            margin-top: 5px;
            font-size: 12px;
            font-weight: 500;
        }
        .password-requirements {
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            line-height: 1.6;
        }
        .requirement {
            display: block;
        }
        .requirement.met {
            color: green;
        }
        .requirement.unmet {
            color: red;
        }
    </style>
</head>
<body>

<div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
</div>

<h2>ShopEase</h2><br><br>

<div class="form">
    <div th:if="${error}" class="error-message" style="color: red; margin-bottom: 15px;">
        <p th:text="${error}"></p>
    </div>

    <h3>Sign Up</h3>
    <br>
    <form th:action="@{/api/public/customers/register}" method="post" onsubmit="return validatePassword()">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="phone">Phone</label>
        <input
                type="tel"
                id="phone"
                name="phone"
                pattern="[0-9]{3}[0-9]{3}[0-9]{4}"
                required /><br><br>

        <label for="email">Email-Id</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="housenumber">House Number</label>
        <input type="text" id="housenumber" name="housenumber" required><br><br>

        <label for="street">Street</label>
        <input type="text" id="street" name="street" required><br><br>

        <label for="city">City</label>
        <input type="text" id="city" name="city" required><br><br>

        <label for="country">Country</label>
        <input type="text" id="country" name="country" required><br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required oninput="checkPasswordStrength()">
        <div id="passwordStrength" class="password-strength"></div>
        <div id="passwordRequirements" class="password-requirements">
            <span class="requirement unmet" id="req-length">✗ At least 8 characters</span>
            <span class="requirement unmet" id="req-uppercase">✗ At least 1 uppercase letter</span>
            <span class="requirement unmet" id="req-lowercase">✗ At least 1 lowercase letter</span>
            <span class="requirement unmet" id="req-number">✗ At least 1 number</span>
            <span class="requirement unmet" id="req-special">✗ At least 1 special character (@$!%*?&)</span>
        </div>
        <br>

        <label for="confirmpassword">Confirm Password</label>
        <input type="password" id="confirmpassword" name="confirmPassword" required><br><br>

        <button type="submit">Submit</button>
    </form>
</div>

<br>
<label><b>Already a customer?</b></label><br>
<a th:href="@{/customerslogin.html}">
    <button class="login">Login</button>
</a>

<script>
    function checkPasswordStrength() {
        const password = document.getElementById('password').value;
        const strengthDiv = document.getElementById('passwordStrength');

        const hasLength = password.length >= 8;
        const hasUpper = /[A-Z]/.test(password);
        const hasLower = /[a-z]/.test(password);
        const hasNumber = /\d/.test(password);
        const hasSpecial = /[@$!%*?&]/.test(password);

        // Update requirement indicators
        updateRequirement('req-length', hasLength);
        updateRequirement('req-uppercase', hasUpper);
        updateRequirement('req-lowercase', hasLower);
        updateRequirement('req-number', hasNumber);
        updateRequirement('req-special', hasSpecial);

        // Calculate strength
        const strength = [hasLength, hasUpper, hasLower, hasNumber, hasSpecial].filter(Boolean).length;

        if (strength === 5) {
            strengthDiv.innerHTML = '✅ Strong password!';
            strengthDiv.style.color = 'green';
        } else if (strength >= 3) {
            strengthDiv.innerHTML = '🟡 Medium strength';
            strengthDiv.style.color = 'orange';
        } else {
            strengthDiv.innerHTML = '❌ Weak password';
            strengthDiv.style.color = 'red';
        }
    }

    function updateRequirement(id, met) {
        const element = document.getElementById(id);
        if (met) {
            element.className = 'requirement met';
            element.innerHTML = element.innerHTML.replace('✗', '✓');
        } else {
            element.className = 'requirement unmet';
            element.innerHTML = element.innerHTML.replace('✓', '✗');
        }
    }

    function validatePassword() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmpassword').value;

        // Strong password regex
        const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

        if (!strongPasswordRegex.test(password)) {
            alert('Password does not meet requirements:\n' +
                '• At least 8 characters\n' +
                '• At least 1 uppercase letter\n' +
                '• At least 1 lowercase letter\n' +
                '• At least 1 number\n' +
                '• At least 1 special character (@$!%*?&)');
            return false;
        }

        if (password !== confirmPassword) {
            alert('Passwords do not match!');
            return false;
        }

        return true;
    }
</script>

</body>
</html>
